<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador — Preact + HTM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a2e; color: #eee; font-family: system-ui, -apple-system, sans-serif; }
        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .counter-card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 16px;
            padding: 2.5rem;
            min-width: 380px;
            max-width: 420px;
            text-align: center;
        }
        .counter-value {
            font-size: 4rem;
            font-weight: 700;
            color: #e94560;
            margin: 1rem 0;
            font-variant-numeric: tabular-nums;
        }
        .history-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 1.5rem;
            text-align: left;
        }
        .history-item {
            padding: 0.4rem 0.75rem;
            border-bottom: 1px solid #0f3460;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        .history-item:first-child {
            border-top: 1px solid #0f3460;
        }
        .history-delta {
            font-weight: 600;
        }
        .delta-pos { color: #4ecca3; }
        .delta-neg { color: #e94560; }
        .delta-reset { color: #f5da55; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { h, Fragment, render } from 'https://esm.sh/preact@10.26.4';
        import { useState, useCallback } from 'https://esm.sh/preact@10.26.4/hooks';
        import htm from 'https://esm.sh/htm@3.1.1';

        const html = htm.bind(h);

        function Counter() {
            const [count, setCount] = useState(0);
            const [history, setHistory] = useState([]);

            const addToHistory = useCallback((delta) => {
                const now = new Date();
                const time = now.toLocaleTimeString();
                setHistory(h => [{ id: Date.now(), delta, time }, ...h]);
            }, []);

            const increment = useCallback(() => {
                setCount(c => c + 1);
                addToHistory(1);
            }, [addToHistory]);

            const decrement = useCallback(() => {
                setCount(c => c - 1);
                addToHistory(-1);
            }, [addToHistory]);

            const reset = useCallback(() => {
                const prev = count;
                setCount(0);
                if (prev !== 0) {
                    addToHistory(-prev);
                }
            }, [count, addToHistory]);

            const deltaLabel = (d) => {
                if (d > 0) return '+' + d;
                if (d < 0) return String(d);
                return '0';
            };

            const deltaClass = (d) => {
                if (d > 0) return 'delta-pos';
                if (d < 0) return 'delta-neg';
                return 'delta-reset';
            };

            return html`
                <div class="counter-card">
                    <h1 class="fs-4 fw-semibold mb-2">Contador</h1>
                    <p class="text-secondary small mb-0">Preact + HTM + Bootstrap</p>

                    <div class="counter-value">${count}</div>

                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <button class="btn btn-success" onClick=${increment}>
                            +1 Sumar
                        </button>
                        <button class="btn btn-outline-warning" onClick=${reset}>
                            ↺ Reiniciar
                        </button>
                        <button class="btn btn-danger" onClick=${decrement}>
                            −1 Restar
                        </button>
                    </div>

                    ${history.length > 0 && html`
                        <h6 class="mt-4 mb-2 text-secondary text-start small text-uppercase">
                            Historial (${history.length})
                        </h6>
                        <div class="history-list">
                            ${history.map(entry => html`
                                <div key=${entry.id} class="history-item">
                                    <span>
                                        <span class="history-delta ${deltaClass(entry.delta)}">
                                            ${deltaLabel(entry.delta)}
                                        </span>
                                    </span>
                                    <span class="text-secondary">${entry.time}</span>
                                </div>
                            `)}
                        </div>
                    `}
                </div>
            `;
        }

        render(html`<${Counter} />`, document.getElementById('root'));
    </script>
</body>
</html>
