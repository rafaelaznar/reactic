<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Datos Aleatorios — React + JSX (CRUD + Ordenación)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #c9d1d9; }
        #root { width: 100%; max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #21262d; }
        .table { margin-bottom: 0; }
        .table th {
            background: #161b22;
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-color: #21262d;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 1.8rem;
        }
        .table th:hover { color: #79c0ff; background: #1c2333; }
        .table th .sort-icon {
            position: absolute;
            right: 0.5rem;
            font-size: 0.7rem;
            opacity: 0.4;
        }
        .table th .sort-icon.active { opacity: 1; }
        .table td {
            border-color: #21262d;
            vertical-align: middle;
            font-variant-numeric: tabular-nums;
            color: #c9d1d9;
        }
        .table tbody tr:hover { background: #161b22; }
        .table tfoot tr {
            font-weight: 600;
        }
        .table tfoot tr.totals-row { background: #1a2332; border-top: 2px solid #30363d; }
        .table tfoot tr.averages-row { background: #1a1f2e; color: #8b949e; }
        .badge-string { background: #238636; }
        .badge-date { background: #1f6feb; }
        .badge-decimal { background: #8957e5; }
        .badge-integer { background: #9e6a03; }
        .badge-boolean { background: #cf222e; }
        .badge-boolean-false { background: #6e7681; }
        .form-control, .btn {
            border-radius: 8px;
        }
        .form-control {
            background: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background: #0d1117;
            border-color: #58a6ff;
            color: #c9d1d9;
            box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.15);
        }
        .btn-action {
            padding: 0.15rem 0.45rem;
            font-size: 0.78rem;
            line-height: 1.3;
        }
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .modal-header {
            border-bottom-color: #21262d;
        }
        .modal-footer {
            border-top-color: #21262d;
        }
        .btn-close { filter: invert(1); }
        .form-check-input {
            background-color: #0d1117;
            border-color: #30363d;
        }
        .form-check-input:checked {
            background-color: #58a6ff;
            border-color: #58a6ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // ── utils ──────────────────────────────────────────────

        const WORDS = [
            'manzana', 'libro', 'nube', 'espejo', 'faro', 'gato', 'luna',
            'rio', 'silla', 'viento', 'piedra', 'llama', 'barco', 'reloj',
            'campo', 'nieve', 'tigre', 'hoja', 'puente', 'semilla', 'roble',
            'coral', 'bruma', 'cetro', 'duna', 'antorcha', 'jazmín', 'cobre',
        ];

        let nextId = 1;

        const randomWord = () => WORDS[Math.floor(Math.random() * WORDS.length)];

        const randomDate = () => {
            const start = new Date(2000, 0, 1).getTime();
            const end = new Date(2030, 11, 31).getTime();
            const d = new Date(start + Math.random() * (end - start));
            return d.toISOString().slice(0, 10);
        };

        const randomDecimal = () => parseFloat((Math.random() * 1000).toFixed(2));

        const randomInteger = () => Math.floor(Math.random() * 1001);

        const randomBool = () => Math.random() < 0.5;

        const generateRows = (count) =>
            Array.from({ length: count }, () => ({
                id: nextId++,
                str: randomWord(),
                date: randomDate(),
                decimal: randomDecimal(),
                integer: randomInteger(),
                bool: randomBool(),
            }));

        // default new/empty row
        const emptyRow = () => ({
            str: '',
            date: new Date().toISOString().slice(0, 10),
            decimal: 0,
            integer: 0,
            bool: false,
        });

        // ── sort helpers ───────────────────────────────────────

        const SORT_COLUMNS = ['id', 'str', 'date', 'decimal', 'integer', 'bool'];

        const compareValues = (a, b, col) => {
            let va, vb;
            switch (col) {
                case 'id':
                case 'integer':
                    va = a[col]; vb = b[col]; break;
                case 'decimal':
                    va = a[col]; vb = b[col]; break;
                case 'str':
                    va = a.str; vb = b.str; break;
                case 'date':
                    va = new Date(a.date).getTime(); vb = new Date(b.date).getTime(); break;
                case 'bool':
                    va = a.bool ? 1 : 0; vb = b.bool ? 1 : 0; break;
                default:
                    return 0;
            }
            if (va < vb) return -1;
            if (va > vb) return 1;
            return 0;
        };

        // ── column header labels ───────────────────────────────

        const COL_LABELS = {
            id: '#',
            str: 'String',
            date: 'Fecha',
            decimal: 'Decimal',
            integer: 'Entero',
            bool: 'Booleano',
        };

        // ── componente fila ───────────────────────────────────

        function Row({ row, onEdit, onDelete }) {
            return (
                <tr>
                    <td className="text-muted" style={{ fontSize: '0.8rem' }}>{row.id}</td>
                    <td>{row.str}</td>
                    <td>{row.date}</td>
                    <td className="text-end">{row.decimal.toFixed(2)}</td>
                    <td className="text-end">{row.integer}</td>
                    <td>
                        {row.bool
                            ? <span className="badge rounded-pill badge-boolean">true</span>
                            : <span className="badge rounded-pill badge-boolean-false">false</span>
                        }
                    </td>
                    <td className="text-end">
                        <button
                            className="btn btn-sm btn-outline-info btn-action me-1"
                            onClick={() => onEdit(row)}
                            title="Editar"
                        >
                            &#9998;
                        </button>
                        <button
                            className="btn btn-sm btn-outline-danger btn-action"
                            onClick={() => onDelete(row.id)}
                            title="Eliminar"
                        >
                            &#10005;
                        </button>
                    </td>
                </tr>
            );
        }

        // ── sortable header ────────────────────────────────────

        function SortableTh({ col, sortKey, sortDir, onSort }) {
            const active = sortKey === col;
            const icon = active ? (sortDir === 'asc' ? '\u25B2' : '\u25BC') : '\u25B3';
            return (
                <th
                    className={col === 'decimal' || col === 'integer' ? 'text-end' : ''}
                    onClick={() => onSort(col)}
                >
                    {COL_LABELS[col]}
                    <span className={'sort-icon' + (active ? ' active' : '')}>{icon}</span>
                </th>
            );
        }

        // ── modal formulario ───────────────────────────────────

        function FormModal({ show, editingRow, formData, onFormChange, onSave, onClose }) {
            if (!show) return null;

            const title = editingRow ? 'Editar registro' : 'Nuevo registro';

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave();
            };

            return (
                <div className="modal d-block" tabIndex="-1" style={{ background: 'rgba(0,0,0,0.6)' }}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header">
                                <h5 className="modal-title" style={{ color: '#58a6ff' }}>{title}</h5>
                                <button type="button" className="btn-close" onClick={onClose}></button>
                            </div>
                            <form onSubmit={handleSubmit}>
                                <div className="modal-body">
                                    <div className="mb-3">
                                        <label className="form-label" style={{ color: '#8b949e', fontSize: '0.85rem' }}>String</label>
                                        <input
                                            type="text"
                                            className="form-control"
                                            value={formData.str}
                                            onChange={(e) => onFormChange('str', e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label" style={{ color: '#8b949e', fontSize: '0.85rem' }}>Fecha</label>
                                        <input
                                            type="date"
                                            className="form-control"
                                            value={formData.date}
                                            onChange={(e) => onFormChange('date', e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label" style={{ color: '#8b949e', fontSize: '0.85rem' }}>Decimal</label>
                                        <input
                                            type="number"
                                            className="form-control"
                                            step="0.01"
                                            value={formData.decimal}
                                            onChange={(e) => onFormChange('decimal', parseFloat(e.target.value) || 0)}
                                        />
                                    </div>
                                    <div className="mb-3">
                                        <label className="form-label" style={{ color: '#8b949e', fontSize: '0.85rem' }}>Entero</label>
                                        <input
                                            type="number"
                                            className="form-control"
                                            step="1"
                                            value={formData.integer}
                                            onChange={(e) => onFormChange('integer', parseInt(e.target.value, 10) || 0)}
                                        />
                                    </div>
                                    <div className="mb-2 form-check">
                                        <input
                                            type="checkbox"
                                            className="form-check-input"
                                            id="boolCheck"
                                            checked={formData.bool}
                                            onChange={(e) => onFormChange('bool', e.target.checked)}
                                        />
                                        <label className="form-check-label" htmlFor="boolCheck">Booleano</label>
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button type="button" className="btn btn-secondary" onClick={onClose}>Cancelar</button>
                                    <button type="submit" className="btn" style={{ background: '#238636', color: '#fff' }}>
                                        {editingRow ? 'Guardar cambios' : 'Añadir registro'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // ── componente principal ──────────────────────────────

        function App() {
            const [n, setN] = React.useState(10);
            const [rows, setRows] = React.useState(() => generateRows(10));

            // sort
            const [sortKey, setSortKey] = React.useState('id');
            const [sortDir, setSortDir] = React.useState('asc');

            // modal
            const [modalOpen, setModalOpen] = React.useState(false);
            const [editingRow, setEditingRow] = React.useState(null); // row being edited, or null for new
            const [formData, setFormData] = React.useState(emptyRow);

            // ── handlers ─────────────────────────────────────

            const handleGenerate = React.useCallback(() => {
                setRows(generateRows(n));
            }, [n]);

            const handleNChange = React.useCallback((e) => {
                const val = parseInt(e.target.value, 10);
                if (!isNaN(val) && val >= 1 && val <= 200) setN(val);
            }, []);

            // sort
            const handleSort = React.useCallback((col) => {
                setSortKey((prevKey) => {
                    if (prevKey === col) {
                        setSortDir((prevDir) => prevDir === 'asc' ? 'desc' : 'asc');
                    } else {
                        setSortDir('asc');
                    }
                    return col;
                });
            }, []);

            // modal open for new row
            const handleAdd = React.useCallback(() => {
                setEditingRow(null);
                setFormData(emptyRow());
                setModalOpen(true);
            }, []);

            // modal open for edit
            const handleEdit = React.useCallback((row) => {
                setEditingRow(row);
                setFormData({
                    str: row.str,
                    date: row.date,
                    decimal: row.decimal,
                    integer: row.integer,
                    bool: row.bool,
                });
                setModalOpen(true);
            }, []);

            // modal close
            const handleModalClose = React.useCallback(() => {
                setModalOpen(false);
                setEditingRow(null);
            }, []);

            // form field change
            const handleFormChange = React.useCallback((field, value) => {
                setFormData((prev) => ({ ...prev, [field]: value }));
            }, []);

            // save (add or update)
            const handleSave = React.useCallback(() => {
                if (editingRow) {
                    // update existing
                    setRows((prev) =>
                        prev.map((r) =>
                            r.id === editingRow.id
                                ? { ...r, str: formData.str, date: formData.date, decimal: formData.decimal, integer: formData.integer, bool: formData.bool }
                                : r
                        )
                    );
                } else {
                    // add new
                    const newRow = {
                        id: nextId++,
                        str: formData.str,
                        date: formData.date,
                        decimal: formData.decimal,
                        integer: formData.integer,
                        bool: formData.bool,
                    };
                    setRows((prev) => [...prev, newRow]);
                }
                setModalOpen(false);
                setEditingRow(null);
            }, [editingRow, formData]);

            // delete
            const handleDelete = React.useCallback((id) => {
                setRows((prev) => prev.filter((r) => r.id !== id));
            }, []);

            // ── derived data ─────────────────────────────────

            // sorted rows (data rows only)
            const sortedRows = React.useMemo(() => {
                const copy = [...rows];
                copy.sort((a, b) => {
                    const cmp = compareValues(a, b, sortKey);
                    return sortDir === 'asc' ? cmp : -cmp;
                });
                return copy;
            }, [rows, sortKey, sortDir]);

            // totals row
            const totals = React.useMemo(() => {
                if (rows.length === 0) return null;
                const decSum = rows.reduce((s, r) => s + r.decimal, 0);
                const intSum = rows.reduce((s, r) => s + r.integer, 0);
                const trueCount = rows.filter(r => r.bool).length;
                const falseCount = rows.length - trueCount;
                return { decSum, intSum, trueCount, falseCount };
            }, [rows]);

            // averages row
            const averages = React.useMemo(() => {
                if (rows.length === 0) return null;
                const decAvg = rows.reduce((s, r) => s + r.decimal, 0) / rows.length;
                const intAvg = rows.reduce((s, r) => s + r.integer, 0) / rows.length;
                return { decAvg, intAvg };
            }, [rows]);

            // stats
            const stats = React.useMemo(() => {
                const count = rows.length;
                const trueCount = rows.filter(r => r.bool).length;
                const decimals = rows.map(r => r.decimal);
                const integers = rows.map(r => r.integer);
                const datesMs = rows.map(r => new Date(r.date).getTime());
                return {
                    count,
                    trueCount,
                    falseCount: count - trueCount,
                    decMin: Math.min(...decimals).toFixed(2),
                    decMax: Math.max(...decimals).toFixed(2),
                    intMin: Math.min(...integers),
                    intMax: Math.max(...integers),
                    dateMin: new Date(Math.min(...datesMs)).toISOString().slice(0, 10),
                    dateMax: new Date(Math.max(...datesMs)).toISOString().slice(0, 10),
                };
            }, [rows]);

            // ── render ───────────────────────────────────────

            return (
                <div>
                    <h1 className="text-center mb-1" style={{ color: '#58a6ff' }}>
                        Matriz de datos aleatorios (CRUD)
                    </h1>
                    <p className="text-center mb-4" style={{ color: '#8b949e' }}>
                        Genera <em>n</em> filas &middot; ordena por columnas &middot; añade, edita y elimina registros
                    </p>

                    {/* controles */}
                    <div className="d-flex flex-wrap align-items-end justify-content-center gap-2 mb-4">
                        <div>
                            <label
                                className="form-label mb-1"
                                style={{ color: '#8b949e', fontSize: '0.85rem' }}
                            >
                                N&uacute;mero de filas (1&ndash;200)
                            </label>
                            <input
                                type="number"
                                className="form-control"
                                style={{ width: '140px' }}
                                min={1}
                                max={200}
                                value={n}
                                onInput={handleNChange}
                            />
                        </div>
                        <div>
                            <label className="form-label mb-1" style={{ visibility: 'hidden' }}>.</label>
                            <button
                                className="btn px-4 fw-semibold"
                                style={{ background: '#238636', color: '#fff' }}
                                onClick={handleGenerate}
                            >
                                Generar
                            </button>
                        </div>
                        <div>
                            <label className="form-label mb-1" style={{ visibility: 'hidden' }}>.</label>
                            <button
                                className="btn px-4 fw-semibold"
                                style={{ background: '#1f6feb', color: '#fff' }}
                                onClick={handleAdd}
                            >
                                + A&ntilde;adir
                            </button>
                        </div>
                    </div>

                    {/* tabla */}
                    <div className="table-wrap mb-4">
                        <table className="table table-dark table-striped table-hover">
                            <thead>
                                <tr>
                                    {SORT_COLUMNS.map((col) => (
                                        <SortableTh
                                            key={col}
                                            col={col}
                                            sortKey={sortKey}
                                            sortDir={sortDir}
                                            onSort={handleSort}
                                        />
                                    ))}
                                    <th style={{ cursor: 'default', color: '#58a6ff' }}>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {sortedRows.map((row) => (
                                    <Row
                                        key={row.id}
                                        row={row}
                                        onEdit={handleEdit}
                                        onDelete={handleDelete}
                                    />
                                ))}
                            </tbody>
                            {(totals || averages) && (
                                <tfoot>
                                    {totals && (
                                        <tr className="totals-row">
                                            <td colSpan="1" style={{ fontWeight: 600 }}>Totales</td>
                                            <td></td>
                                            <td></td>
                                            <td className="text-end">{totals.decSum.toFixed(2)}</td>
                                            <td className="text-end">{totals.intSum}</td>
                                            <td>
                                                <span className="badge rounded-pill badge-boolean me-1">true: {totals.trueCount}</span>
                                                <span className="badge rounded-pill badge-boolean-false">false: {totals.falseCount}</span>
                                            </td>
                                            <td></td>
                                        </tr>
                                    )}
                                    {averages && (
                                        <tr className="averages-row">
                                            <td colSpan="1" style={{ fontWeight: 600 }}>Medias</td>
                                            <td></td>
                                            <td></td>
                                            <td className="text-end">{averages.decAvg.toFixed(2)}</td>
                                            <td className="text-end">{averages.intAvg.toFixed(2)}</td>
                                            <td></td>
                                            <td></td>
                                        </tr>
                                    )}
                                </tfoot>
                            )}
                        </table>
                    </div>

                    {/* badges resumen */}
                    <div
                        className="d-flex flex-wrap justify-content-center gap-2 mb-3"
                        style={{ fontSize: '0.82rem' }}
                    >
                        <span className="badge rounded-pill badge-string px-3 py-2">
                            {stats.count} filas
                        </span>
                        <span className="badge rounded-pill badge-date px-3 py-2">
                            {'\u{1F4C5}'} {stats.dateMin} &rarr; {stats.dateMax}
                        </span>
                        <span className="badge rounded-pill badge-decimal px-3 py-2">
                            Decimal: {stats.decMin} &ndash; {stats.decMax}
                        </span>
                        <span className="badge rounded-pill badge-integer px-3 py-2">
                            Entero: {stats.intMin} &ndash; {stats.intMax}
                        </span>
                        <span className="badge rounded-pill badge-boolean px-3 py-2">
                            true: {stats.trueCount}
                        </span>
                        <span className="badge rounded-pill badge-boolean-false px-3 py-2">
                            false: {stats.falseCount}
                        </span>
                    </div>

                    {/* modal */}
                    <FormModal
                        show={modalOpen}
                        editingRow={editingRow}
                        formData={formData}
                        onFormChange={handleFormChange}
                        onSave={handleSave}
                        onClose={handleModalClose}
                    />

                    {/* footer */}
                    <p
                        className="text-center mt-4"
                        style={{ color: '#484f58', fontSize: '0.8rem' }}
                    >
                        React 18 &middot; JSX &middot; Babel standalone &middot; Bootstrap 5 &middot; CRUD &middot; Ordenaci&oacute;n
                    </p>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
