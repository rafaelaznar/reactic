<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Local — React + JSX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" rel="stylesheet">
  <style>
    :root {
      --sidebar-width: 320px;
    }
    body { background: #f8f9fa; }
    .app-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 1030;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .wiki-icon { width: 28px; height: 28px; margin-right: 10px; }
    .breadcrumb-wiki {
      background: #fff;
      border-bottom: 1px solid #dee2e6;
      padding: .5rem 1rem;
      font-size: .875rem;
      position: sticky;
      top: 56px;
      z-index: 1020;
    }
    .breadcrumb-wiki a {
      color: #0d6efd;
      text-decoration: none;
    }
    .breadcrumb-wiki a:hover { text-decoration: underline; }
    .main-layout {
      display: flex;
      min-height: calc(100vh - 106px);
    }
    .sidebar {
      width: var(--sidebar-width);
      background: #fff;
      border-right: 1px solid #dee2e6;
      overflow-y: auto;
      position: sticky;
      top: 90px;
      height: calc(100vh - 90px);
      flex-shrink: 0;
    }
    .content-area {
      flex: 1;
      max-width: 860px;
      padding: 2rem;
      margin: 0 auto;
    }
    .wiki-content h1 { font-size: 2rem; border-bottom: 2px solid #0d6efd; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    .wiki-content h2 { font-size: 1.5rem; margin-top: 2rem; border-bottom: 1px solid #dee2e6; padding-bottom: .25rem; }
    .wiki-content h3 { font-size: 1.25rem; margin-top: 1.5rem; }
    .wiki-content pre { background: #f5f5f5; border-radius: 8px; padding: 1rem; }
    .wiki-content code { font-size: .875rem; }
    .wiki-content blockquote {
      border-left: 4px solid #0d6efd;
      padding: .5rem 1rem;
      margin: 1rem 0;
      background: #f0f7ff;
      border-radius: 0 8px 8px 0;
    }
    .wiki-content table { width: 100%; margin: 1rem 0; }
    .wiki-content table th { background: #f0f7ff; }
    .wiki-content img { max-width: 100%; border-radius: 8px; }
    .wiki-content details {
      border: 1px solid #dee2e6;
      padding: .75rem 1rem;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .toc-link { color: #495057; text-decoration: none; display: block; padding: .25rem .5rem; border-radius: 4px; font-size: .875rem; }
    .toc-link:hover { background: #e9ecef; color: #0d6efd; }
    .toc-link.toc-h2 { padding-left: 1.5rem; }
    .toc-link.toc-h3 { padding-left: 2.5rem; }
    .index-link { color: #495057; text-decoration: none; display: block; padding: .2rem .5rem; border-radius: 4px; font-size: .875rem; }
    .index-link:hover { background: #e9ecef; color: #0d6efd; }
    .index-link.index-dir { font-weight: 600; color: #6c757d; }
    .index-children { padding-left: 1rem; }
    .placeholder-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      color: #6c757d;
    }
    .placeholder-box .display-1 { font-size: 4rem; }
    .toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; }
    .btn-open-folder { transition: all .2s; }
    .btn-open-folder:hover { transform: scale(1.05); }
    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        max-height: 40vh;
        position: static;
        border-right: none;
        border-bottom: 1px solid #dee2e6;
      }
      .content-area { padding: 1rem; }
    }
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem 0;
      border-bottom: 1px solid #dee2e6;
      margin-bottom: .5rem;
    }
    .editor-textarea {
      width: 100%;
      min-height: 60vh;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: .9rem;
      line-height: 1.6;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 1rem;
      resize: vertical;
      background: #fafafa;
    }
    .editor-textarea:focus {
      outline: none;
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13,110,253,.15);
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Marked config ──────────────────────────────────────────
    marked.setOptions({
      gfm: true,
      breaks: false,
    });

    // ── Helpers ────────────────────────────────────────────────
    function slugify(text) {
      return text
        .toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-') || 'heading';
    }

    function resolvePath(base, rel) {
      const parts = (base + '/' + rel).split('/');
      const out = [];
      for (const p of parts) {
        if (p === '..') out.pop();
        else if (p !== '.' && p !== '') out.push(p);
      }
      return out.join('/');
    }

    // ── Icon SVGs ──────────────────────────────────────────────
    const Icons = {
      folder:   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>,
      toc:      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
      index:    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="21" y1="5" x2="3" y2="5"/><line x1="18" y1="10" x2="3" y2="10"/><line x1="14" y1="15" x2="3" y2="15"/><line x1="18" y1="20" x2="3" y2="20"/></svg>,
      home:     <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      top:      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>,
      wikiLogo: <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>,
      edit:     <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      save:     <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
      cancel:   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
    };

    // ── Toast Component ────────────────────────────────────────
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 3000);
        return () => clearTimeout(t);
      }, [message]);
      return (
        <div className={`toast show align-items-center text-bg-${type === 'error' ? 'danger' : 'success'} border-0`} role="alert">
          <div className="d-flex">
            <div className="toast-body">{message}</div>
            <button type="button" className="btn-close btn-close-white me-2 m-auto" onClick={onClose}></button>
          </div>
        </div>
      );
    }

    // ── Sidebar TOC ───────────────────────────────────────────
    function SidebarTOC({ headings, activeTab, setActiveTab }) {
      return (
        <div className="d-flex flex-column h-100">
          <ul className="nav nav-tabs nav-fill" role="tablist">
            <li className="nav-item" role="presentation">
              <button className={`nav-link ${activeTab === 'toc' ? 'active' : ''}`} onClick={() => setActiveTab('toc')}>
                {Icons.toc} <span className="ms-1 d-none d-md-inline">TOC</span>
              </button>
            </li>
            <li className="nav-item" role="presentation">
              <button className={`nav-link ${activeTab === 'index' ? 'active' : ''}`} onClick={() => setActiveTab('index')}>
                {Icons.index} <span className="ms-1 d-none d-md-inline">Index</span>
              </button>
            </li>
          </ul>
          <div className="flex-grow-1 overflow-auto p-2">
            {activeTab === 'toc' && (
              headings.length === 0 ? (
                <p className="text-muted small p-2">No headings on this page.</p>
              ) : (
                headings.map((h, i) => (
                  <a key={i} href={`#${h.id}`} className={`toc-link toc-h${h.level}`}
                    onClick={(e) => {
                      e.preventDefault();
                      document.getElementById(h.id)?.scrollIntoView({ behavior: 'smooth' });
                    }}>
                    {h.text}
                  </a>
                ))
              )
            )}
          </div>
        </div>
      );
    }

    // ── Sidebar Index ─────────────────────────────────────────
    function SidebarIndex({ tree, pages, onNavigate }) {
      function renderTree(node, prefix = '') {
        const keys = Object.keys(node).sort();
        if (keys.length === 0) return null;
        return (
          <ul className="list-unstyled mb-0">
            {keys.map(key => {
              const path = prefix ? prefix + '/' + key : key;
              const children = Object.keys(node[key]);
              const isPage = pages.has(path);
              return (
                <li key={path}>
                  {isPage ? (
                    <a href="#" className="index-link" onClick={(e) => { e.preventDefault(); onNavigate(path); }}>
                      📄 {key}
                    </a>
                  ) : (
                    <span className="index-link index-dir">📁 {key}</span>
                  )}
                  {children.length > 0 && (
                    <div className="index-children">{renderTree(node[key], path)}</div>
                  )}
                </li>
              );
            })}
          </ul>
        );
      }
      return <div className="p-2">{renderTree(tree)}</div>;
    }

    // ── Breadcrumb ────────────────────────────────────────────
    function Breadcrumb({ page, onNavigate }) {
      const parts = page === 'index' ? [] : page.split('/');
      return (
        <div className="breadcrumb-wiki">
          <a href="#" onClick={(e) => { e.preventDefault(); onNavigate('index'); }}>
            {Icons.home} <span className="ms-1">Home</span>
          </a>
          {parts.map((p, i) => {
            const path = parts.slice(0, i + 1).join('/');
            return (
              <span key={i}>
                <span className="mx-1 text-muted">›</span>
                <a href="#" onClick={(e) => { e.preventDefault(); onNavigate(path); }}>{p}</a>
              </span>
            );
          })}
        </div>
      );
    }

    // ── Rendered Content ──────────────────────────────────────
    function RenderedContent({ html, page, pages, onNavigate }) {
      const contentRef = useRef(null);

      useEffect(() => {
        if (!contentRef.current) return;

        // Highlight code blocks
        contentRef.current.querySelectorAll('pre code').forEach(block => {
          hljs.highlightElement(block);
        });

        // Add heading IDs and "go to top" buttons
        const seen = {};
        contentRef.current.querySelectorAll('h1, h2, h3').forEach(h => {
          let slug = slugify(h.textContent);
          if (seen[slug]) { seen[slug]++; slug += '-' + seen[slug]; }
          else { seen[slug] = 1; }
          h.id = slug;
        });

        // Rewrite internal links
        contentRef.current.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href');
          if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:')) {
            const cleanHref = href.replace(/\.md$/, '');
            const base = page.includes('/') ? page.slice(0, page.lastIndexOf('/') + 1) : '';
            const target = resolvePath(base, cleanHref);
            if (pages.has(target) || target === 'index') {
              a.href = '#';
              a.addEventListener('click', (e) => {
                e.preventDefault();
                onNavigate(target);
              });
            }
          }
        });
      }, [html, page]);

      return <div ref={contentRef} className="wiki-content" dangerouslySetInnerHTML={{ __html: html }} />;
    }

    // ── Placeholder ───────────────────────────────────────────
    function Placeholder({ onOpen }) {
      return (
        <div className="placeholder-box">
          <div className="display-1 mb-3">📚</div>
          <h2 className="mb-3">Local Wiki</h2>
          <p className="text-muted mb-4">
            Select a folder on your computer containing <code>.md</code> files<br/>
            to browse them as a wiki.
          </p>
          <button className="btn btn-primary btn-lg btn-open-folder" onClick={onOpen}>
            {Icons.folder} <span className="ms-2">Open Folder</span>
          </button>
          <p className="small text-muted mt-3">
            Requires a browser with File System Access API support<br/>
            (Chrome, Edge, Opera)
          </p>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────
    function App() {
      const [dirHandle, setDirHandle] = useState(null);
      const [files, setFiles] = useState({});        // path → content
      const [fileHandles, setFileHandles] = useState({}); // path → FileSystemFileHandle
      const [pages, setPages] = useState(new Set());
      const [tree, setTree] = useState({});
      const [currentPage, setCurrentPage] = useState('index');
      const [html, setHtml] = useState('');
      const [rawMd, setRawMd] = useState('');
      const [headings, setHeadings] = useState([]);
      const [activeTab, setActiveTab] = useState('toc');
      const [toast, setToast] = useState(null);
      const [wikiName, setWikiName] = useState('Local Wiki');
      const [loading, setLoading] = useState(false);
      const [editing, setEditing] = useState(false);

      // ── Recursively read all .md files ──────────────────────
      const readDirectory = useCallback(async (handle, basePath = '') => {
        const result = {};
        const handles = {};
        const pageSet = new Set();
        for await (const [name, entry] of handle.entries()) {
          if (entry.kind === 'file' && name.endsWith('.md')) {
            const path = basePath ? basePath + '/' + name.replace(/\.md$/, '') : name.replace(/\.md$/, '');
            handles[path] = entry;
            const file = await entry.getFile();
            const content = await file.text();
            result[path] = content;
            pageSet.add(path);
          } else if (entry.kind === 'directory') {
            const sub = await readDirectory(entry, basePath ? basePath + '/' + name : name);
            Object.assign(result, sub.files);
            Object.assign(handles, sub.handles);
            for (const p of sub.pages) pageSet.add(p);
          }
        }
        return { files: result, handles, pages: pageSet };
      }, []);

      // ── Build tree from flat page list ──────────────────────
      const buildTree = useCallback((pageSet) => {
        const t = {};
        for (const page of pageSet) {
          const parts = page.split('/');
          let node = t;
          for (const p of parts) {
            node[p] = node[p] || {};
            node = node[p];
          }
        }
        return t;
      }, []);

      // ── Extract headings from HTML ──────────────────────────
      const extractHeadings = useCallback((htmlString) => {
        const div = document.createElement('div');
        div.innerHTML = htmlString;
        const hs = [];
        const seen = {};
        div.querySelectorAll('h1, h2, h3').forEach(h => {
          let slug = slugify(h.textContent);
          if (seen[slug]) { seen[slug]++; slug += '-' + seen[slug]; }
          else { seen[slug] = 1; }
          hs.push({ level: parseInt(h.tagName[1]), text: h.textContent, id: slug });
        });
        return hs;
      }, []);

      // ── Open folder handler ─────────────────────────────────
      const handleOpenFolder = useCallback(async () => {
        try {
          setLoading(true);
          const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
          setDirHandle(handle);
          setWikiName(handle.name);
          const { files: f, handles: h, pages: p } = await readDirectory(handle);
          setFiles(f);
          setFileHandles(h);
          setPages(p);
          setTree(buildTree(p));
          setEditing(false);

          // Load index or first page
          const initialPage = p.has('index') ? 'index' : [...p][0] || 'index';
          setCurrentPage(initialPage);
          const md = f[initialPage] || '*No content found.*';
          setRawMd(md);
          const rendered = marked.parse(md);
          setHtml(rendered);
          setHeadings(extractHeadings(rendered));
          setToast({ message: `Loaded ${p.size} page(s) from "${handle.name}"`, type: 'success' });
        } catch (err) {
          if (err.name !== 'AbortError') {
            setToast({ message: 'Error: ' + err.message, type: 'error' });
          }
        } finally {
          setLoading(false);
        }
      }, [readDirectory, buildTree, extractHeadings]);

      // ── Navigate to page ────────────────────────────────────
      const navigate = useCallback((page) => {
        const md = files[page];
        if (md !== undefined) {
          setEditing(false);
          setCurrentPage(page);
          setRawMd(md);
          const rendered = marked.parse(md);
          setHtml(rendered);
          setHeadings(extractHeadings(rendered));
          window.scrollTo(0, 0);
          document.title = (rendered.match(/<h1[^>]*>([^<]+)<\/h1>/) || [, page])[1] + ' — Wiki';
        }
      }, [files, extractHeadings]);

      // ── Toggle edit mode ───────────────────────────────────
      const handleEdit = useCallback(() => {
        setEditing(true);
      }, []);

      const handleCancel = useCallback(() => {
        setEditing(false);
      }, []);

      // ── Save page back to disk ─────────────────────────────
      const handleSave = useCallback(async () => {
        try {
          const fh = fileHandles[currentPage];
          if (!fh) {
            setToast({ message: 'Cannot save: no file handle found.', type: 'error' });
            return;
          }
          const writable = await fh.createWritable();
          await writable.write(rawMd);
          await writable.close();

          // Update in-memory cache
          const newFiles = { ...files, [currentPage]: rawMd };
          setFiles(newFiles);
          setEditing(false);

          // Re-render
          const rendered = marked.parse(rawMd);
          setHtml(rendered);
          setHeadings(extractHeadings(rendered));
          setToast({ message: `Page "${currentPage}" saved to disk.`, type: 'success' });
        } catch (err) {
          setToast({ message: 'Save error: ' + err.message, type: 'error' });
        }
      }, [currentPage, rawMd, files, fileHandles, extractHeadings]);

      // ── Ctrl+S to save ─────────────────────────────────────
      useEffect(() => {
        const handler = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 's' && editing) {
            e.preventDefault();
            handleSave();
          }
          if (e.key === 'Escape' && editing) {
            handleCancel();
          }
        };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [editing, handleSave, handleCancel]);

      // ── Render ──────────────────────────────────────────────
      if (!dirHandle) {
        return (
          <>
            <nav className="app-header navbar navbar-dark">
              <div className="container-fluid">
                <span className="navbar-brand d-flex align-items-center">
                  {Icons.wikiLogo} Local Wiki
                </span>
                <span className="badge bg-light text-dark">React + JSX</span>
              </div>
            </nav>
            <Placeholder onOpen={handleOpenFolder} />
            {toast && <div className="toast-container"><Toast {...toast} onClose={() => setToast(null)} /></div>}
          </>
        );
      }

      return (
        <>
          {/* Header */}
          <nav className="app-header navbar navbar-dark">
            <div className="container-fluid">
              <span className="navbar-brand d-flex align-items-center">
                {Icons.wikiLogo} {wikiName}
              </span>
              <div className="d-flex align-items-center gap-2">
                <button className="btn btn-sm btn-outline-light" onClick={() => navigate('index')} title="Home">
                  {Icons.home}
                </button>
                {!editing && (
                  <button className="btn btn-sm btn-outline-light" onClick={handleEdit} title="Edit page">
                    {Icons.edit}
                  </button>
                )}
                {editing && (
                  <>
                    <button className="btn btn-sm btn-outline-success" onClick={handleSave} title="Save (Ctrl+S)">
                      {Icons.save}
                    </button>
                    <button className="btn btn-sm btn-outline-danger" onClick={handleCancel} title="Cancel (Esc)">
                      {Icons.cancel}
                    </button>
                  </>
                )}
                <button className="btn btn-sm btn-outline-light" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} title="Go to top">
                  {Icons.top}
                </button>
                <button className="btn btn-sm btn-outline-warning" onClick={handleOpenFolder} title="Open another folder">
                  {Icons.folder}
                </button>
                <span className="badge bg-light text-dark ms-2">React + JSX</span>
              </div>
            </div>
          </nav>

          {/* Breadcrumb */}
          <Breadcrumb page={currentPage} onNavigate={navigate} />

          {/* Main Layout */}
          <div className="main-layout">
            {/* Sidebar */}
            <aside className="sidebar">
              {activeTab === 'toc' ? (
                <SidebarTOC headings={headings} activeTab={activeTab} setActiveTab={setActiveTab} />
              ) : (
                <>
                  <ul className="nav nav-tabs nav-fill">
                    <li className="nav-item">
                      <button className={`nav-link ${activeTab === 'toc' ? 'active' : ''}`} onClick={() => setActiveTab('toc')}>{Icons.toc} <span className="ms-1 d-none d-md-inline">TOC</span></button>
                    </li>
                    <li className="nav-item">
                      <button className={`nav-link ${activeTab === 'index' ? 'active' : ''}`} onClick={() => setActiveTab('index')}>{Icons.index} <span className="ms-1 d-none d-md-inline">Index</span></button>
                    </li>
                  </ul>
                  <div className="flex-grow-1 overflow-auto p-2">
                    <SidebarIndex tree={tree} pages={pages} onNavigate={navigate} />
                  </div>
                </>
              )}
            </aside>

            {/* Content */}
            <main className="content-area">
              {loading ? (
                <div className="text-center py-5">
                  <div className="spinner-border text-primary" role="status">
                    <span className="visually-hidden">Loading...</span>
                  </div>
                  <p className="mt-2 text-muted">Reading files...</p>
                </div>
              ) : editing ? (
                <div>
                  <div className="editor-toolbar">
                    <button className="btn btn-sm btn-success" onClick={handleSave} title="Save (Ctrl+S)">
                      {Icons.save} Save
                    </button>
                    <button className="btn btn-sm btn-outline-secondary" onClick={handleCancel} title="Cancel (Esc)">
                      {Icons.cancel} Cancel
                    </button>
                    <span className="ms-auto text-muted small">Ctrl+S to save · Esc to cancel</span>
                  </div>
                  <textarea
                    className="editor-textarea"
                    value={rawMd}
                    onChange={(e) => setRawMd(e.target.value)}
                    spellCheck="false"
                    autoFocus
                  />
                </div>
              ) : (
                <RenderedContent html={html} page={currentPage} pages={pages} onNavigate={navigate} />
              )}
            </main>
          </div>

          {/* Toast */}
          {toast && <div className="toast-container"><Toast {...toast} onClose={() => setToast(null)} /></div>}
        </>
      );
    }

    // ── Mount ─────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
