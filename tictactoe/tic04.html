<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en Raya - Tic Tac Toe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; color: #eee; }
        #root { text-align: center; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 4px;
            background: #0f3460;
            padding: 4px;
            border-radius: 12px;
            width: fit-content;
            margin: 0 auto 1rem;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #1a1a2e;
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            color: #eee;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .cell:not(:disabled) { cursor: pointer; }
        .cell:hover:not(:disabled) { background: #2a2a4e; }
        .cell:disabled { cursor: default; opacity: 0.85; }
        .cell.win-cell { background: #0f3460; color: #e94560; }
        .history-wrap {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }
        .history-wrap .btn-outline-history {
            --bs-btn-color: #aaa;
            --bs-btn-border-color: #0f3460;
            --bs-btn-bg: #16213e;
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: #0f3460;
            --bs-btn-hover-border-color: #0f3460;
            --bs-btn-font-size: 0.8rem;
            --bs-btn-padding-y: 0.2rem;
            --bs-btn-padding-x: 0.6rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/typescript@5.7.3/lib/typescript.js"></script>

    <script type="text/typescript">
        interface SquareProps {
            value: string | null;
            onSquareClick: () => void;
            isWinning: boolean;
        }

        function Square({ value, onSquareClick, isWinning }: SquareProps) {
            return (
                <button
                    className={`cell${isWinning ? ' win-cell' : ''}`}
                    onClick={onSquareClick}
                    disabled={value !== null}
                >
                    {value}
                </button>
            );
        }

        interface BoardProps {
            squares: (string | null)[];
            winLine: number[] | null;
            onSquareClick: (i: number) => void;
        }

        function Board({ squares, winLine, onSquareClick }: BoardProps) {
            const cells = squares.map((value, i) => (
                <Square
                    key={i}
                    value={value}
                    isWinning={winLine !== null && winLine.includes(i)}
                    onSquareClick={() => onSquareClick(i)}
                />
            ));
            return <div className="board">{cells}</div>;
        }

        interface WinnerResult {
            winner: string;
            line: number[] | null;
        }

        function calculateWinner(squares: (string | null)[]): WinnerResult | null {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6],
            ];
            for (const [a, b, c] of lines) {
                if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
                    return { winner: squares[a]!, line: [a, b, c] };
                }
            }
            if (squares.every(s => s !== null)) return { winner: 'empate', line: null };
            return null;
        }

        function Game() {
            const [history, setHistory] = React.useState<(string | null)[][]>([Array(9).fill(null)]);
            const [currentMove, setCurrentMove] = React.useState<number>(0);
            const currentSquares = history[currentMove];
            const xIsNext = currentMove % 2 === 0;

            const result = calculateWinner(currentSquares);
            const gameOver = result !== null;

            let status: string;
            let statusClass = 'badge fs-5 px-3 py-2 mb-3';
            if (gameOver) {
                if (result.winner === 'empate') {
                    status = '¡Empate!';
                    statusClass += ' bg-secondary';
                } else {
                    status = `Ganador: ${result.winner}`;
                    statusClass += ' bg-danger';
                }
            } else {
                status = `Turno de: ${xIsNext ? 'X' : 'O'}`;
                statusClass += ' bg-dark';
            }

            function handleSquareClick(i: number): void {
                if (gameOver || currentSquares[i] !== null) return;

                const nextSquares = currentSquares.slice() as (string | null)[];
                nextSquares[i] = xIsNext ? 'X' : 'O';

                const nextHistory = [...history.slice(0, currentMove + 1), nextSquares];
                setHistory(nextHistory);
                setCurrentMove(nextHistory.length - 1);
            }

            function jumpTo(move: number): void {
                setCurrentMove(move);
            }

            function resetGame(): void {
                setHistory([Array(9).fill(null)]);
                setCurrentMove(0);
            }

            const moves = history.map((_, move) => (
                <button
                    key={move}
                    onClick={() => jumpTo(move)}
                    className="btn btn-outline-history"
                >
                    {move === 0 ? 'Ir al inicio' : `Ir al movimiento #${move}`}
                </button>
            ));

            return (
                <>
                    <h1 className="text-danger mb-2" style={{ color: '#e94560' }}>Tres en Raya</h1>
                    <div className={statusClass}>{status}</div>
                    <Board
                        squares={currentSquares}
                        winLine={result ? result.line : null}
                        onSquareClick={handleSquareClick}
                    />
                    <button
                        className="btn btn-danger px-4 py-2 fw-semibold"
                        onClick={resetGame}
                    >
                        Reiniciar
                    </button>
                    {history.length > 1 && (
                        <div className="history-wrap">{moves}</div>
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')!);
        root.render(<Game />);
    </script>

    <script>
        function compileTypeScript() {
            var scripts = document.querySelectorAll('script[type="text/typescript"]');
            scripts.forEach(function(script) {
                var source = script.textContent || '';
                if (!source.trim()) return;
                var result = ts.transpileModule(source, {
                    compilerOptions: {
                        module: ts.ModuleKind.ESNext,
                        jsx: ts.JsxEmit.React,
                        target: ts.ScriptTarget.ES2015,
                    }
                });
                var newScript = document.createElement('script');
                newScript.textContent = result.outputText;
                document.body.appendChild(newScript);
            });
        }
        compileTypeScript();
    </script>
</body>
</html>
