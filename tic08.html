<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en Raya - Tic Tac Toe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a2e; color: #eee; }
        #root { text-align: center; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 4px;
            background: #0f3460;
            padding: 4px;
            border-radius: 12px;
            width: fit-content;
            margin: 0 auto 1rem;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #1a1a2e;
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            color: #eee;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .cell:not(:disabled) { cursor: pointer; }
        .cell:hover:not(:disabled) { background: #2a2a4e; }
        .cell:disabled { cursor: default; opacity: 0.85; }
        .cell.win-cell { background: #0f3460; color: #e94560; }
        .status-badge {
            font-size: 1.1rem;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .history-wrap {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }
        .history-wrap .btn-hist {
            background: #16213e;
            color: #aaa;
            border: 1px solid #0f3460;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .history-wrap .btn-hist:hover { background: #0f3460; color: #fff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div id="root"></div>

    <script src="https://unpkg.com/preact@10.26.4/dist/preact.min.js"></script>

    <script>
        const { h, Fragment, Component } = preact;

        const Square = (props) =>
            h('button', {
                className: 'cell' + (props.isWinning ? ' win-cell' : ''),
                onClick: props.onSquareClick,
                disabled: props.value !== null,
            }, props.value || '');

        const Board = (props) =>
            h('div', { className: 'board' },
                props.squares.map((value, i) =>
                    h(Square, {
                        key: i,
                        value,
                        isWinning: props.winLine && props.winLine.includes(i),
                        onSquareClick: () => props.onCellClick(i),
                    })
                )
            );

        const calculateWinner = (squares) => {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6],
            ];
            for (const [a, b, c] of lines) {
                if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c])
                    return { winner: squares[a], line: [a, b, c] };
            }
            if (squares.every(s => s !== null)) return { winner: 'empate', line: null };
            return null;
        };

        class Game extends Component {
            constructor() {
                super();
                this.state = {
                    history: [Array(9).fill(null)],
                    currentMove: 0,
                };
            }

            currentSquares() {
                return this.state.history[this.state.currentMove];
            }

            xIsNext() {
                return this.state.currentMove % 2 === 0;
            }

            handleSquareClick(i) {
                if (this._result || this.currentSquares()[i] !== null) return;
                const nextSquares = this.currentSquares().slice();
                nextSquares[i] = this.xIsNext() ? 'X' : 'O';
                const nextHistory = [...this.state.history.slice(0, this.state.currentMove + 1), nextSquares];
                this.setState({
                    history: nextHistory,
                    currentMove: nextHistory.length - 1,
                });
            }

            jumpTo(move) {
                this.setState({ currentMove: move });
            }

            resetGame() {
                this.setState({
                    history: [Array(9).fill(null)],
                    currentMove: 0,
                });
            }

            render() {
                const result = calculateWinner(this.currentSquares());
                this._result = result;
                const gameOver = result !== null;

                let status, statusClass = 'status-badge bg-dark';
                if (gameOver) {
                    if (result.winner === 'empate') {
                        status = '\u00a1Empate!';
                        statusClass = 'status-badge bg-secondary';
                    } else {
                        status = 'Ganador: ' + result.winner;
                        statusClass = 'status-badge bg-danger';
                    }
                } else {
                    status = 'Turno de: ' + (this.xIsNext() ? 'X' : 'O');
                }

                const moves = this.state.history.length > 1
                    ? this.state.history.map((_, move) =>
                        h('button', {
                            key: move,
                            className: 'btn-hist',
                            onClick: () => this.jumpTo(move),
                        }, move === 0 ? 'Ir al inicio' : 'Ir al movimiento #' + move)
                    )
                    : [];

                const children = [
                    h('h1', { className: 'text-danger mb-2', style: { color: '#e94560' } }, 'Tres en Raya'),
                    h('div', { className: statusClass }, status),
                    h(Board, {
                        squares: this.currentSquares(),
                        winLine: result ? result.line : null,
                        onCellClick: (i) => this.handleSquareClick(i),
                    }),
                    h('button', {
                        className: 'btn btn-danger px-4 py-2 fw-semibold',
                        onClick: () => this.resetGame(),
                    }, 'Reiniciar'),
                ];

                if (moves.length) {
                    children.push(h('div', { className: 'history-wrap' }, moves));
                }

                return h(Fragment, null, children);
            }
        }

        preact.render(h(Game), document.getElementById('root'));
    </script>
</body>
</html>
