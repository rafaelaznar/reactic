<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laberinto - Maze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
        }
        #root { text-align: center; }
        h1 { font-size: 2rem; margin-bottom: 0.25rem; color: #e94560; }
        canvas {
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }
        .stats {
            font-size: 0.85rem;
            color: #aaa;
            min-height: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const ROWS = 12, COLS = 12, CELL = 35;

        function generateMaze(rows, cols) {
            const grid = [];
            for (let r = 0; r < rows; r++) {
                grid[r] = [];
                for (let c = 0; c < cols; c++)
                    grid[r][c] = { row: r, col: c, walls: [true, true, true, true], visited: false };
            }
            function removeWall(r1, c1, r2, c2) {
                if (r1 === r2) {
                    if (c1 < c2) { grid[r1][c1].walls[1] = false; grid[r2][c2].walls[3] = false; }
                    else { grid[r1][c1].walls[3] = false; grid[r2][c2].walls[1] = false; }
                } else {
                    if (r1 < r2) { grid[r1][c1].walls[2] = false; grid[r2][c2].walls[0] = false; }
                    else { grid[r1][c1].walls[0] = false; grid[r2][c2].walls[2] = false; }
                }
            }
            const stack = [grid[0][0]];
            grid[0][0].visited = true;
            while (stack.length) {
                const cur = stack[stack.length - 1];
                const nn = [];
                if (cur.row > 0 && !grid[cur.row-1][cur.col].visited) nn.push(grid[cur.row-1][cur.col]);
                if (cur.row < rows-1 && !grid[cur.row+1][cur.col].visited) nn.push(grid[cur.row+1][cur.col]);
                if (cur.col > 0 && !grid[cur.row][cur.col-1].visited) nn.push(grid[cur.row][cur.col-1]);
                if (cur.col < cols-1 && !grid[cur.row][cur.col+1].visited) nn.push(grid[cur.row][cur.col+1]);
                if (nn.length) {
                    const next = nn[Math.floor(Math.random() * nn.length)];
                    removeWall(cur.row, cur.col, next.row, next.col);
                    next.visited = true;
                    stack.push(next);
                } else stack.pop();
            }
            return grid;
        }

        function getNeighbors(grid, r, c) {
            const n = [];
            const cell = grid[r][c];
            if (!cell.walls[0] && r > 0) n.push(grid[r-1][c]);
            if (!cell.walls[1] && c < grid[0].length-1) n.push(grid[r][c+1]);
            if (!cell.walls[2] && r < grid.length-1) n.push(grid[r+1][c]);
            if (!cell.walls[3] && c > 0) n.push(grid[r][c-1]);
            return n;
        }

        function bfs(grid, rows, cols) {
            const start = grid[0][0], end = grid[rows-1][cols-1];
            const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
            const parent = Array.from({ length: rows }, () => Array(cols).fill(null));
            const queue = [start];
            visited[0][0] = true;
            let head = 0;
            while (head < queue.length) {
                const cur = queue[head++];
                if (cur === end) break;
                for (const nb of getNeighbors(grid, cur.row, cur.col)) {
                    if (!visited[nb.row][nb.col]) {
                        visited[nb.row][nb.col] = true;
                        parent[nb.row][nb.col] = cur;
                        queue.push(nb);
                    }
                }
            }
            const path = [];
            let cur = end;
            while (cur) { path.unshift(cur); cur = parent[cur.row][cur.col]; }
            return path[0] === start ? path : null;
        }

        function dfs(grid, rows, cols) {
            const start = grid[0][0], end = grid[rows-1][cols-1];
            const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
            const parent = Array.from({ length: rows }, () => Array(cols).fill(null));
            const stack = [start];
            visited[0][0] = true;
            while (stack.length) {
                const cur = stack.pop();
                if (cur === end) break;
                for (const nb of getNeighbors(grid, cur.row, cur.col)) {
                    if (!visited[nb.row][nb.col]) {
                        visited[nb.row][nb.col] = true;
                        parent[nb.row][nb.col] = cur;
                        stack.push(nb);
                    }
                }
            }
            const path = [];
            let cur = end;
            while (cur) { path.unshift(cur); cur = parent[cur.row][cur.col]; }
            return path[0] === start ? path : null;
        }

        function drawMaze(ctx, grid, rows, cols, path) {
            const W = cols * CELL, H = rows * CELL;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = '#0f3460';
            ctx.lineWidth = 2;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = grid[r][c];
                    const x = c * CELL, y = r * CELL;
                    if (cell.walls[0]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + CELL, y); ctx.stroke(); }
                    if (cell.walls[1]) { ctx.beginPath(); ctx.moveTo(x + CELL, y); ctx.lineTo(x + CELL, y + CELL); ctx.stroke(); }
                    if (cell.walls[2]) { ctx.beginPath(); ctx.moveTo(x, y + CELL); ctx.lineTo(x + CELL, y + CELL); ctx.stroke(); }
                    if (cell.walls[3]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + CELL); ctx.stroke(); }
                }
            }

            ctx.fillStyle = '#00cc66';
            ctx.fillRect(4, 4, CELL - 8, CELL - 8);

            ctx.fillStyle = '#e94560';
            ctx.fillRect((cols-1)*CELL + 4, (rows-1)*CELL + 4, CELL - 8, CELL - 8);

            if (path) {
                ctx.strokeStyle = '#4fc3f7';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                for (let i = 0; i < path.length; i++) {
                    const cx = path[i].col * CELL + CELL / 2;
                    const cy = path[i].row * CELL + CELL / 2;
                    i === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
                }
                ctx.stroke();
            }
        }

        function MazeApp() {
            const canvasRef = React.useRef(null);
            const [grid, setGrid] = React.useState(null);
            const [path, setPath] = React.useState(null);
            const [stats, setStats] = React.useState('');

            React.useEffect(() => {
                const g = generateMaze(ROWS, COLS);
                setGrid(g);
                setPath(null);
                setStats('');
            }, []);

            React.useEffect(() => {
                if (!grid) return;
                const ctx = canvasRef.current.getContext('2d');
                drawMaze(ctx, grid, ROWS, COLS, path);
            }, [grid, path]);

            function clearPath() {
                setPath(null);
                setStats('');
            }

            function reset() {
                setGrid(generateMaze(ROWS, COLS));
                setPath(null);
                setStats('');
            }

            function solveBFS() {
                if (!grid) return;
                const start = performance.now();
                const p = bfs(grid, ROWS, COLS);
                const elapsed = ((performance.now() - start) / 1000).toFixed(3);
                setPath(p);
                setStats(p ? `BFS — ${p.length-1} pasos en ${elapsed}s` : 'BFS — sin solución');
            }

            function solveDFS() {
                if (!grid) return;
                const start = performance.now();
                const p = dfs(grid, ROWS, COLS);
                const elapsed = ((performance.now() - start) / 1000).toFixed(3);
                setPath(p);
                setStats(p ? `DFS — ${p.length-1} pasos en ${elapsed}s` : 'DFS — sin solución');
            }

            const W = COLS * CELL, H = ROWS * CELL;

            return (
                <div className="d-flex flex-column align-items-center">
                    <h1>Laberinto</h1>
                    <p className="text-secondary mb-2" style={{ fontSize: '0.9rem' }}>
                        {ROWS}&times;{COLS} &middot; <span style={{ color: '#00cc66' }}>&#9632;</span> inicio &middot; <span style={{ color: '#e94560' }}>&#9632;</span> meta
                    </p>
                    <canvas
                        ref={canvasRef}
                        width={W}
                        height={H}
                        className="border border-secondary mb-3"
                        style={{ background: '#1a1a2e' }}
                    />
                    <div className="d-flex gap-2 mb-2 flex-wrap justify-content-center">
                        <button className="btn btn-outline-info" onClick={solveBFS}>
                            Resolver en Amplitud (BFS)
                        </button>
                        <button className="btn btn-outline-warning" onClick={solveDFS}>
                            Resolver en Profundidad (DFS)
                        </button>
                        <button className="btn btn-outline-danger" onClick={reset}>
                            Reset
                        </button>
                        <button className="btn btn-outline-secondary" onClick={clearPath} disabled={path === null}>
                            Limpiar
                        </button>
                    </div>
                    <div className="stats">{stats}</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MazeApp />);
    </script>
</body>
</html>
