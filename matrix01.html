<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Datos Aleatorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #c9d1d9; }
        #root { width: 100%; max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
        .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #21262d; }
        .table { margin-bottom: 0; }
        .table th {
            background: #161b22;
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-color: #21262d;
            white-space: nowrap;
        }
        .table td {
            border-color: #21262d;
            vertical-align: middle;
            font-variant-numeric: tabular-nums;
            color: #c9d1d9;
        }
        .table tbody tr:hover { background: #161b22; }
        .badge-string { background: #238636; }
        .badge-date { background: #1f6feb; }
        .badge-decimal { background: #8957e5; }
        .badge-integer { background: #9e6a03; }
        .badge-boolean { background: #cf222e; }
        .badge-boolean-false { background: #6e7681; }
        .form-control, .btn {
            border-radius: 8px;
        }
        .form-control {
            background: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background: #0d1117;
            border-color: #58a6ff;
            color: #c9d1d9;
            box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.15);
        }
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.5rem;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { h, render } from 'https://esm.sh/preact@10.26.4';
        import { useState, useCallback, useMemo } from 'https://esm.sh/preact@10.26.4/hooks';

        // ── utils ──────────────────────────────────────────────

        const WORDS = [
            'manzana', 'libro', 'nube', 'espejo', 'faro', 'gato', 'luna',
            'rio', 'silla', 'viento', 'piedra', 'llama', 'barco', 'reloj',
            'campo', 'nieve', 'tigre', 'hoja', 'puente', 'semilla', 'roble',
            'coral', 'bruma', 'cetro', 'duna', 'antorcha', 'jazmín', 'cobre',
        ];

        const randomWord = () => WORDS[Math.floor(Math.random() * WORDS.length)];

        const randomDate = () => {
            const start = new Date(2000, 0, 1).getTime();
            const end = new Date(2030, 11, 31).getTime();
            const d = new Date(start + Math.random() * (end - start));
            return d.toISOString().slice(0, 10); // YYYY-MM-DD
        };

        const randomDecimal = (decimals = 2) =>
            parseFloat((Math.random() * 1000).toFixed(decimals));

        const randomInteger = (min = 0, max = 1000) =>
            Math.floor(Math.random() * (max - min + 1)) + min;

        const randomBool = () => Math.random() < 0.5;

        // ── componente fila ───────────────────────────────────

        const Row = ({ row }) =>
            h('tr', null,
                h('td', null, row.str),
                h('td', null, row.date),
                h('td', { className: 'text-end' }, row.decimal.toFixed(2)),
                h('td', { className: 'text-end' }, row.integer),
                h('td', null,
                    row.bool
                        ? h('span', { className: 'badge rounded-pill badge-boolean' }, 'true')
                        : h('span', { className: 'badge rounded-pill badge-boolean-false' }, 'false')
                )
            );

        // ── componente principal ──────────────────────────────

        const App = () => {
            const [n, setN] = useState(10);
            const [rows, setRows] = useState(() => generateRows(10));

            function generateRows(count) {
                return Array.from({ length: count }, () => ({
                    str: randomWord(),
                    date: randomDate(),
                    decimal: randomDecimal(),
                    integer: randomInteger(),
                    bool: randomBool(),
                }));
            }

            const handleGenerate = useCallback(() => {
                setRows(generateRows(n));
            }, [n]);

            const handleNChange = useCallback((e) => {
                const val = parseInt(e.target.value, 10);
                if (!isNaN(val) && val >= 1 && val <= 200) setN(val);
            }, []);

            // stats
            const stats = useMemo(() => {
                const count = rows.length;
                const trueCount = rows.filter(r => r.bool).length;
                const decimals = rows.map(r => r.decimal);
                const integers = rows.map(r => r.integer);
                const datesMs = rows.map(r => new Date(r.date).getTime());
                return {
                    count,
                    trueCount,
                    falseCount: count - trueCount,
                    decMin: Math.min(...decimals).toFixed(2),
                    decMax: Math.max(...decimals).toFixed(2),
                    intMin: Math.min(...integers),
                    intMax: Math.max(...integers),
                    dateMin: new Date(Math.min(...datesMs)).toISOString().slice(0, 10),
                    dateMax: new Date(Math.max(...datesMs)).toISOString().slice(0, 10),
                };
            }, [rows]);

            return h('div', null,
                // header
                h('h1', { className: 'text-center mb-1', style: { color: '#58a6ff' } },
                    'Matriz de datos aleatorios'),
                h('p', { className: 'text-center mb-4', style: { color: '#8b949e' } },
                    'Genera ', h('em', null, 'n'), ' filas con valores de distinto tipo'),

                // controles
                h('div', {
                    className: 'd-flex flex-wrap align-items-end justify-content-center gap-2 mb-4'
                },
                    h('div', null,
                        h('label', {
                            className: 'form-label mb-1',
                            style: { color: '#8b949e', fontSize: '0.85rem' }
                        }, 'N\u00famero de filas (1\u2013200)'),
                        h('input', {
                            type: 'number',
                            className: 'form-control',
                            style: { width: '140px' },
                            min: 1,
                            max: 200,
                            value: n,
                            onInput: handleNChange,
                        })
                    ),
                    h('div', null,
                        h('label', { className: 'form-label mb-1', style: { visibility: 'hidden' } }, '.'),
                        h('button', {
                            className: 'btn px-4 fw-semibold',
                            style: { background: '#238636', color: '#fff' },
                            onClick: handleGenerate,
                        }, 'Generar')
                    )
                ),

                // tabla
                h('div', { className: 'table-wrap mb-4' },
                    h('table', { className: 'table table-dark table-striped table-hover' },
                        h('thead', null,
                            h('tr', null,
                                h('th', null, 'String'),
                                h('th', null, 'Fecha'),
                                h('th', { className: 'text-end' }, 'Decimal'),
                                h('th', { className: 'text-end' }, 'Entero'),
                                h('th', null, 'Booleano'),
                            )
                        ),
                        h('tbody', null,
                            rows.map((row, i) => h(Row, { key: i, row }))
                        )
                    )
                ),

                // badges resumen
                h('div', {
                    className: 'd-flex flex-wrap justify-content-center gap-2 mb-3',
                    style: { fontSize: '0.82rem' }
                },
                    h('span', { className: 'badge rounded-pill badge-string px-3 py-2' },
                        stats.count + ' filas'),
                    h('span', { className: 'badge rounded-pill badge-date px-3 py-2' },
                        '\ud83d\udcc5 ' + stats.dateMin + ' \u2192 ' + stats.dateMax),
                    h('span', { className: 'badge rounded-pill badge-decimal px-3 py-2' },
                        'Decimal: ' + stats.decMin + ' \u2013 ' + stats.decMax),
                    h('span', { className: 'badge rounded-pill badge-integer px-3 py-2' },
                        'Entero: ' + stats.intMin + ' \u2013 ' + stats.intMax),
                    h('span', { className: 'badge rounded-pill badge-boolean px-3 py-2' },
                        'true: ' + stats.trueCount),
                    h('span', { className: 'badge rounded-pill badge-boolean-false px-3 py-2' },
                        'false: ' + stats.falseCount),
                ),

                // footer
                h('p', {
                    className: 'text-center mt-4',
                    style: { color: '#484f58', fontSize: '0.8rem' }
                }, 'Preact \u00b7 h() directo \u00b7 sin Babel ni JSX \u00b7 Bootstrap 5'),
            );
        };

        render(h(App), document.getElementById('root'));
    </script>
</body>
</html>
