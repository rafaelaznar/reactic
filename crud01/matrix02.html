<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Datos Aleatorios — React + JSX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #c9d1d9; }
        #root { width: 100%; max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
        .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #21262d; }
        .table { margin-bottom: 0; }
        .table th {
            background: #161b22;
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-color: #21262d;
            white-space: nowrap;
        }
        .table td {
            border-color: #21262d;
            vertical-align: middle;
            font-variant-numeric: tabular-nums;
            color: #c9d1d9;
        }
        .table tbody tr:hover { background: #161b22; }
        .badge-string { background: #238636; }
        .badge-date { background: #1f6feb; }
        .badge-decimal { background: #8957e5; }
        .badge-integer { background: #9e6a03; }
        .badge-boolean { background: #cf222e; }
        .badge-boolean-false { background: #6e7681; }
        .form-control, .btn {
            border-radius: 8px;
        }
        .form-control {
            background: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background: #0d1117;
            border-color: #58a6ff;
            color: #c9d1d9;
            box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // ── utils ──────────────────────────────────────────────

        const WORDS = [
            'manzana', 'libro', 'nube', 'espejo', 'faro', 'gato', 'luna',
            'rio', 'silla', 'viento', 'piedra', 'llama', 'barco', 'reloj',
            'campo', 'nieve', 'tigre', 'hoja', 'puente', 'semilla', 'roble',
            'coral', 'bruma', 'cetro', 'duna', 'antorcha', 'jazmín', 'cobre',
        ];

        const randomWord = () => WORDS[Math.floor(Math.random() * WORDS.length)];

        const randomDate = () => {
            const start = new Date(2000, 0, 1).getTime();
            const end = new Date(2030, 11, 31).getTime();
            const d = new Date(start + Math.random() * (end - start));
            return d.toISOString().slice(0, 10);
        };

        const randomDecimal = () => parseFloat((Math.random() * 1000).toFixed(2));

        const randomInteger = () => Math.floor(Math.random() * 1001);

        const randomBool = () => Math.random() < 0.5;

        const generateRows = (count) =>
            Array.from({ length: count }, () => ({
                str: randomWord(),
                date: randomDate(),
                decimal: randomDecimal(),
                integer: randomInteger(),
                bool: randomBool(),
            }));

        // ── componente fila ───────────────────────────────────

        function Row({ row }) {
            return (
                <tr>
                    <td>{row.str}</td>
                    <td>{row.date}</td>
                    <td className="text-end">{row.decimal.toFixed(2)}</td>
                    <td className="text-end">{row.integer}</td>
                    <td>
                        {row.bool
                            ? <span className="badge rounded-pill badge-boolean">true</span>
                            : <span className="badge rounded-pill badge-boolean-false">false</span>
                        }
                    </td>
                </tr>
            );
        }

        // ── componente principal ──────────────────────────────

        function App() {
            const [n, setN] = React.useState(10);
            const [rows, setRows] = React.useState(() => generateRows(10));

            const handleGenerate = React.useCallback(() => {
                setRows(generateRows(n));
            }, [n]);

            const handleNChange = React.useCallback((e) => {
                const val = parseInt(e.target.value, 10);
                if (!isNaN(val) && val >= 1 && val <= 200) setN(val);
            }, []);

            const stats = React.useMemo(() => {
                const count = rows.length;
                const trueCount = rows.filter(r => r.bool).length;
                const decimals = rows.map(r => r.decimal);
                const integers = rows.map(r => r.integer);
                const datesMs = rows.map(r => new Date(r.date).getTime());
                return {
                    count,
                    trueCount,
                    falseCount: count - trueCount,
                    decMin: Math.min(...decimals).toFixed(2),
                    decMax: Math.max(...decimals).toFixed(2),
                    intMin: Math.min(...integers),
                    intMax: Math.max(...integers),
                    dateMin: new Date(Math.min(...datesMs)).toISOString().slice(0, 10),
                    dateMax: new Date(Math.max(...datesMs)).toISOString().slice(0, 10),
                };
            }, [rows]);

            return (
                <div>
                    <h1 className="text-center mb-1" style={{ color: '#58a6ff' }}>
                        Matriz de datos aleatorios
                    </h1>
                    <p className="text-center mb-4" style={{ color: '#8b949e' }}>
                        Genera <em>n</em> filas con valores de distinto tipo
                    </p>

                    {/* controles */}
                    <div className="d-flex flex-wrap align-items-end justify-content-center gap-2 mb-4">
                        <div>
                            <label
                                className="form-label mb-1"
                                style={{ color: '#8b949e', fontSize: '0.85rem' }}
                            >
                                N&uacute;mero de filas (1&ndash;200)
                            </label>
                            <input
                                type="number"
                                className="form-control"
                                style={{ width: '140px' }}
                                min={1}
                                max={200}
                                value={n}
                                onInput={handleNChange}
                            />
                        </div>
                        <div>
                            <label className="form-label mb-1" style={{ visibility: 'hidden' }}>.</label>
                            <button
                                className="btn px-4 fw-semibold"
                                style={{ background: '#238636', color: '#fff' }}
                                onClick={handleGenerate}
                            >
                                Generar
                            </button>
                        </div>
                    </div>

                    {/* tabla */}
                    <div className="table-wrap mb-4">
                        <table className="table table-dark table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>String</th>
                                    <th>Fecha</th>
                                    <th className="text-end">Decimal</th>
                                    <th className="text-end">Entero</th>
                                    <th>Booleano</th>
                                </tr>
                            </thead>
                            <tbody>
                                {rows.map((row, i) => <Row key={i} row={row} />)}
                            </tbody>
                        </table>
                    </div>

                    {/* badges resumen */}
                    <div
                        className="d-flex flex-wrap justify-content-center gap-2 mb-3"
                        style={{ fontSize: '0.82rem' }}
                    >
                        <span className="badge rounded-pill badge-string px-3 py-2">
                            {stats.count} filas
                        </span>
                        <span className="badge rounded-pill badge-date px-3 py-2">
                            {'\u{1F4C5}'} {stats.dateMin} &rarr; {stats.dateMax}
                        </span>
                        <span className="badge rounded-pill badge-decimal px-3 py-2">
                            Decimal: {stats.decMin} &ndash; {stats.decMax}
                        </span>
                        <span className="badge rounded-pill badge-integer px-3 py-2">
                            Entero: {stats.intMin} &ndash; {stats.intMax}
                        </span>
                        <span className="badge rounded-pill badge-boolean px-3 py-2">
                            true: {stats.trueCount}
                        </span>
                        <span className="badge rounded-pill badge-boolean-false px-3 py-2">
                            false: {stats.falseCount}
                        </span>
                    </div>

                    {/* footer */}
                    <p
                        className="text-center mt-4"
                        style={{ color: '#484f58', fontSize: '0.8rem' }}
                    >
                        React 18 &middot; JSX &middot; Babel standalone &middot; Bootstrap 5
                    </p>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
