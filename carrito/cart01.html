<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras — React + JSX + Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f0f2f5; color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif; }
        #root { padding: 2rem 1.5rem; max-width: 1100px; margin: 0 auto; }
        .product-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 1.25rem;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .product-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-color: #ccc;
        }
        .cart-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            position: sticky;
            top: 1.5rem;
        }
        .cart-item {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            transition: background 0.15s;
        }
        .cart-item:hover { background: #f0f0f0; }
        .qty-btn {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 2px solid #ccc;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.15s, border-color 0.15s;
            padding: 0;
            line-height: 1;
        }
        .qty-btn:hover { background: #e9ecef; border-color: #999; }
        .qty-btn:active { background: #dee2e6; }
        .total-bar {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            border-radius: 10px;
            color: #fff;
            padding: 1rem 1.25rem;
        }
        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            color: #aaa;
        }
        .badge-qty {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0d6efd;
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.7rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/babel">
        const { useReducer } = React;

        // ── Productos predefinidos ──────────────────────────────────
        const PRODUCTS = [
            { id: 1, name: 'Teclado mecánico', price: 89.99, emoji: '⌨️' },
            { id: 2, name: 'Monitor 27" 4K', price: 399.99, emoji: '🖥️' },
            { id: 3, name: 'Ratón inalámbrico', price: 49.99, emoji: '🖱️' },
            { id: 4, name: 'Auriculares Bluetooth', price: 129.99, emoji: '🎧' },
            { id: 5, name: 'Webcam HD 1080p', price: 69.99, emoji: '📷' },
            { id: 6, name: 'Hub USB-C 7 puertos', price: 34.99, emoji: '🔌' },
        ];

        // ── Reducer ─────────────────────────────────────────────────
        const ACTIONS = {
            ADD: 'ADD',
            INCREASE: 'INCREASE',
            DECREASE: 'DECREASE',
            REMOVE: 'REMOVE',
            CLEAR: 'CLEAR',
        };

        function cartReducer(state, action) {
            switch (action.type) {
                case ACTIONS.ADD: {
                    const existing = state.find(item => item.id === action.payload.id);
                    if (existing) {
                        return state.map(item =>
                            item.id === action.payload.id
                                ? { ...item, quantity: item.quantity + 1 }
                                : item
                        );
                    }
                    return [...state, { ...action.payload, quantity: 1 }];
                }
                case ACTIONS.INCREASE:
                    return state.map(item =>
                        item.id === action.payload
                            ? { ...item, quantity: item.quantity + 1 }
                            : item
                    );
                case ACTIONS.DECREASE: {
                    const item = state.find(i => i.id === action.payload);
                    if (item && item.quantity === 1) {
                        return state.filter(i => i.id !== action.payload);
                    }
                    return state.map(item =>
                        item.id === action.payload
                            ? { ...item, quantity: item.quantity - 1 }
                            : item
                    );
                }
                case ACTIONS.REMOVE:
                    return state.filter(item => item.id !== action.payload);
                case ACTIONS.CLEAR:
                    return [];
                default:
                    return state;
            }
        }

        // ── Componentes ─────────────────────────────────────────────
        function ProductCard({ product, cartItem, dispatch }) {
            const inCart = Boolean(cartItem);

            return (
                <div className="product-card d-flex align-items-center gap-3">
                    <span style={{fontSize: '2rem'}}>{product.emoji}</span>
                    <div className="flex-grow-1">
                        <div className="fw-semibold">{product.name}</div>
                        <div className="text-primary fw-bold fs-5">${product.price.toFixed(2)}</div>
                    </div>
                    {inCart && (
                        <span className="badge-qty me-1">{cartItem.quantity}</span>
                    )}
                    <button
                        className="btn btn-outline-primary btn-sm px-3"
                        onClick={() => dispatch({ type: ACTIONS.ADD, payload: product })}
                    >
                        <i className="bi bi-cart-plus me-1"></i>Agregar
                    </button>
                </div>
            );
        }

        function CartItem({ item, dispatch }) {
            return (
                <div className="cart-item d-flex align-items-center gap-2">
                    <span style={{fontSize: '1.3rem'}}>{item.emoji}</span>
                    <div className="flex-grow-1" style={{minWidth: 0}}>
                        <div className="fw-medium text-truncate small">{item.name}</div>
                        <div className="text-muted" style={{fontSize: '0.8rem'}}>
                            ${item.price.toFixed(2)} c/u
                        </div>
                    </div>
                    <div className="d-flex align-items-center gap-1">
                        <button
                            className="qty-btn"
                            onClick={() => dispatch({ type: ACTIONS.DECREASE, payload: item.id })}
                            title="Disminuir"
                        >−</button>
                        <span className="fw-semibold px-1" style={{minWidth: '1.5rem', textAlign:'center'}}>
                            {item.quantity}
                        </span>
                        <button
                            className="qty-btn"
                            onClick={() => dispatch({ type: ACTIONS.INCREASE, payload: item.id })}
                            title="Aumentar"
                        >+</button>
                    </div>
                    <button
                        className="btn btn-sm text-danger border-0"
                        onClick={() => dispatch({ type: ACTIONS.REMOVE, payload: item.id })}
                        title="Eliminar"
                    >
                        <i className="bi bi-trash3"></i>
                    </button>
                </div>
            );
        }

        function App() {
            const [cart, dispatch] = useReducer(cartReducer, []);

            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

            const getCartItem = (productId) => cart.find(i => i.id === productId);

            return (
                <div className="row g-4">
                    {/* ── Productos ── */}
                    <div className="col-lg-7">
                        <h1 className="fs-4 fw-semibold mb-1">
                            <i className="bi bi-shop me-2"></i>Tienda
                        </h1>
                        <p className="text-muted small mb-4">React + JSX + Bootstrap · useReducer</p>

                        <div className="d-flex flex-column gap-3">
                            {PRODUCTS.map(product => (
                                <ProductCard
                                    key={product.id}
                                    product={product}
                                    cartItem={getCartItem(product.id)}
                                    dispatch={dispatch}
                                />
                            ))}
                        </div>
                    </div>

                    {/* ── Carrito ── */}
                    <div className="col-lg-5">
                        <div className="cart-card p-4">
                            <div className="d-flex justify-content-between align-items-center mb-3">
                                <h2 className="fs-5 fw-semibold mb-0">
                                    <i className="bi bi-cart3 me-2"></i>Carrito
                                    {totalItems > 0 && (
                                        <span className="badge bg-primary ms-2">{totalItems}</span>
                                    )}
                                </h2>
                                {cart.length > 0 && (
                                    <button
                                        className="btn btn-outline-danger btn-sm"
                                        onClick={() => dispatch({ type: ACTIONS.CLEAR })}
                                        title="Vaciar carrito"
                                    >
                                        <i className="bi bi-x-circle me-1"></i>Vaciar
                                    </button>
                                )}
                            </div>

                            {cart.length === 0 ? (
                                <div className="empty-cart">
                                    <i className="bi bi-basket" style={{fontSize:'2.5rem',display:'block',marginBottom:'0.5rem'}}></i>
                                    <p className="mb-0">El carrito está vacío</p>
                                    <p className="small text-muted">Agrega productos desde la tienda</p>
                                </div>
                            ) : (
                                <div className="d-flex flex-column gap-2 mb-3">
                                    {cart.map(item => (
                                        <CartItem key={item.id} item={item} dispatch={dispatch} />
                                    ))}
                                </div>
                            )}

                            {cart.length > 0 && (
                                <div className="total-bar d-flex justify-content-between align-items-center">
                                    <div>
                                        <div style={{fontSize:'0.75rem',opacity:0.85}}>Total</div>
                                        <div className="fs-4 fw-bold">${total.toFixed(2)}</div>
                                    </div>
                                    <button className="btn btn-light btn-sm px-3 fw-semibold">
                                        <i className="bi bi-credit-card me-1"></i>Pagar
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
