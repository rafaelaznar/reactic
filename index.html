<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en Raya - Tic Tac Toe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
        }

        #root {
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #e94560;
        }

        .status {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            display: inline-block;
        }

        .winner {
            background: #0f3460;
            color: #e94560;
            font-weight: bold;
        }

        .turn {
            background: #16213e;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 4px;
            background: #0f3460;
            padding: 4px;
            border-radius: 12px;
            margin: 0 auto 1rem;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #1a1a2e;
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            color: #eee;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .cell:hover:not(:disabled) {
            background: #2a2a4e;
        }

        .cell:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .cell.win-cell {
            background: #0f3460;
            color: #e94560;
        }

        .reset {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 0.65rem 2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.15s;
        }

        .reset:hover {
            background: #d63851;
        }

        .history {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .history button {
            background: #16213e;
            color: #aaa;
            border: 1px solid #0f3460;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .history button:hover {
            background: #0f3460;
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        function Square({ value, onSquareClick, isWinning }) {
            return (
                <button
                    className={`cell ${isWinning ? 'win-cell' : ''}`}
                    onClick={onSquareClick}
                    disabled={value !== null}
                >
                    {value}
                </button>
            );
        }

        function Board({ squares, winLine, onSquareClick }) {
            const cells = squares.map((value, i) => (
                <Square
                    key={i}
                    value={value}
                    isWinning={winLine && winLine.includes(i)}
                    onSquareClick={() => onSquareClick(i)}
                />
            ));

            return <div className="board">{cells}</div>;
        }

        function calculateWinner(squares) {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6],
            ];
            for (const [a, b, c] of lines) {
                if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
                    return { winner: squares[a], line: [a, b, c] };
                }
            }
            if (squares.every(s => s !== null)) return { winner: 'empate', line: null };
            return null;
        }

        function Game() {
            const [history, setHistory] = React.useState([Array(9).fill(null)]);
            const [currentMove, setCurrentMove] = React.useState(0);
            const currentSquares = history[currentMove];
            const xIsNext = currentMove % 2 === 0;

            const result = calculateWinner(currentSquares);
            const gameOver = result !== null;

            let status;
            let statusClass = 'status turn';
            if (gameOver) {
                if (result.winner === 'empate') {
                    status = '¡Empate!';
                } else {
                    status = `Ganador: ${result.winner}`;
                    statusClass = 'status winner';
                }
            } else {
                status = `Turno de: ${xIsNext ? 'X' : 'O'}`;
            }

            function handleSquareClick(i) {
                if (gameOver || currentSquares[i] !== null) return;

                const nextSquares = currentSquares.slice();
                nextSquares[i] = xIsNext ? 'X' : 'O';

                const nextHistory = [...history.slice(0, currentMove + 1), nextSquares];
                setHistory(nextHistory);
                setCurrentMove(nextHistory.length - 1);
            }

            function jumpTo(move) {
                setCurrentMove(move);
            }

            function resetGame() {
                setHistory([Array(9).fill(null)]);
                setCurrentMove(0);
            }

            const moves = history.map((_, move) => (
                <button key={move} onClick={() => jumpTo(move)}>
                    {move === 0 ? 'Ir al inicio' : `Ir al movimiento #${move}`}
                </button>
            ));

            return (
                <>
                    <h1>Tres en Raya</h1>
                    <div className={statusClass}>{status}</div>
                    <Board
                        squares={currentSquares}
                        winLine={result ? result.line : null}
                        onSquareClick={handleSquareClick}
                    />
                    <button className="reset" onClick={resetGame}>Reiniciar</button>
                    {history.length > 1 && <div className="history">{moves}</div>}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>

</html>
