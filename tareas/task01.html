<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas — React + JSX + Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a2e; color: #eee; font-family: system-ui, -apple-system, sans-serif; }
        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .task-card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 16px;
            padding: 2.5rem;
            min-width: 420px;
            max-width: 520px;
            width: 100%;
        }
        .task-item {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: background 0.2s, border-color 0.2s;
        }
        .task-item:hover {
            border-color: #e94560;
        }
        .task-item.completed {
            opacity: 0.55;
        }
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }
        .task-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #4ecca3;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, border-color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .task-check.done {
            background: #4ecca3;
            border-color: #4ecca3;
        }
        .task-check.done::after {
            content: '✓';
            font-size: 0.8rem;
            color: #1a1a2e;
            font-weight: 700;
        }
        .task-input {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            color: #eee;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .task-input:focus {
            background: #1a1a2e;
            border-color: #e94560;
            box-shadow: 0 0 0 0.2rem rgba(233, 69, 96, 0.15);
            color: #eee;
            outline: none;
        }
        .task-input::placeholder { color: #666; }
        .empty-state {
            padding: 3rem 1rem;
            text-align: center;
            color: #666;
        }
        .empty-state i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.75rem;
            color: #0f3460;
        }
        .task-counter {
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useCallback, useEffect } = React;

        function TaskApp() {
            const [tasks, setTasks] = useState([]);
            const [text, setText] = useState('');
            const inputRef = useRef(null);

            const focusInput = useCallback(() => {
                inputRef.current?.focus();
            }, []);

            const addTask = useCallback(() => {
                const trimmed = text.trim();
                if (!trimmed) return;
                setTasks(t => [...t, { id: Date.now(), text: trimmed, done: false }]);
                setText('');
                focusInput();
            }, [text, focusInput]);

            const toggleTask = useCallback((id) => {
                setTasks(t => t.map(task =>
                    task.id === id ? { ...task, done: !task.done } : task
                ));
            }, []);

            const deleteTask = useCallback((id) => {
                setTasks(t => t.filter(task => task.id !== id));
            }, []);

            const handleKeyDown = useCallback((e) => {
                if (e.key === 'Enter') addTask();
            }, [addTask]);

            useEffect(() => {
                focusInput();
            }, [focusInput]);

            const pendingCount = tasks.filter(t => !t.done).length;
            const completedCount = tasks.filter(t => t.done).length;

            return (
                <div className="task-card">
                    <h1 className="fs-4 fw-semibold mb-1">
                        <i className="bi bi-list-check me-2"></i>Lista de Tareas
                    </h1>
                    <p className="text-secondary small mb-4">React 18 + JSX + Bootstrap 5</p>

                    <div className="input-group mb-3">
                        <input
                            ref={inputRef}
                            type="text"
                            className="task-input form-control"
                            placeholder="Escribe una nueva tarea…"
                            value={text}
                            onChange={e => setText(e.target.value)}
                            onKeyDown={handleKeyDown}
                        />
                        <button
                            className="btn px-3"
                            style={{ background: '#e94560', color: '#fff', borderColor: '#e94560' }}
                            onClick={addTask}
                            disabled={!text.trim()}
                        >
                            <i className="bi bi-plus-lg"></i>
                        </button>
                    </div>

                    {tasks.length === 0 && (
                        <div className="empty-state">
                            <i className="bi bi-inbox"></i>
                            <p className="mb-0">No hay tareas aún. ¡Agrega la primera!</p>
                        </div>
                    )}

                    {tasks.length > 0 && (
                        <>
                            <div className="task-counter mb-2">
                                {pendingCount} pendiente{pendingCount !== 1 ? 's' : ''}
                                {completedCount > 0 && ` · ${completedCount} completada${completedCount !== 1 ? 's' : ''}`}
                            </div>

                            <div className="d-flex flex-column gap-2">
                                {tasks.map(task => (
                                    <div key={task.id} className={`task-item d-flex align-items-center gap-3 ${task.done ? 'completed' : ''}`}>
                                        <div
                                            className={`task-check ${task.done ? 'done' : ''}`}
                                            onClick={() => toggleTask(task.id)}
                                            role="checkbox"
                                            aria-checked={task.done}
                                            tabIndex={0}
                                            onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTask(task.id); } }}
                                        ></div>
                                        <span className="task-text flex-grow-1">{task.text}</span>
                                        <button
                                            className="btn btn-sm text-secondary border-0"
                                            onClick={() => deleteTask(task.id)}
                                            title="Eliminar tarea"
                                        >
                                            <i className="bi bi-trash3"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<TaskApp />);
    </script>
</body>
</html>
